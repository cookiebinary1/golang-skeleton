name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --timeout 5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - run: go test -race -cover ./...

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          target: release
          push: false
          tags: golang-skeleton/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
        working-directory: services/web
      - run: npm test
        working-directory: services/web
      - run: npm run build
        working-directory: services/web

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, release]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-kubectl@v4
      - name: Validate configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
          kubectl kustomize deploy/k8s/overlays/dev > /dev/null
          kubectl kustomize deploy/k8s/overlays/prod > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Install browser tests
        working-directory: services/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start and test stack
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = release ]; then
            export COMPOSE_FILE=compose.yaml:compose.prod.yaml
          fi
          docker compose up -d --build
          ./scripts/smoke.sh
          npm run test:e2e --prefix services/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-${{ matrix.mode }}
          path: services/web/test-results/
          if-no-files-found: ignore
      - name: Logs and cleanup
        if: always()
        env:
          MODE: ${{ matrix.mode }}
        run: |
          if [ "$MODE" = release ]; then
            export COMPOSE_FILE=compose.yaml:compose.prod.yaml
          fi
          docker compose logs --no-color
          docker compose down -v
